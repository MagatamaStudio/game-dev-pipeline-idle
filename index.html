<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0b">
<title>车库工作室 · M0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f0d0b'/%3E%3Crect x='7' y='12' width='18' height='11' rx='2' fill='%23ffb454'/%3E%3Ccircle cx='12' cy='17' r='1.8' fill='%230f0d0b'/%3E%3Ccircle cx='20' cy='17' r='1.8' fill='%230f0d0b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header class="hud">
    <div class="hud-left">
      <div class="studio">车库工作室</div>
      <div class="platform">平台 <b id="platform">L-3</b></div>
    </div>

    <div class="hud-stats">
      <div class="hstat"><label>资金</label><b id="money">$0</b></div>
      <div class="hstat"><label>粉丝</label><b id="fans">0</b></div>
      <div class="hstat"><label>作品</label><b id="round">1</b></div>
    </div>

    <button class="icon" id="sound" data-act="sound" title="音效开关">🔊</button>
  </header>

  <section class="office" aria-label="办公室">
    <div class="desks" id="desks"></div>
  </section>

  <main id="stage"></main>

  <footer class="hint" id="hint"></footer>

</div>

<div class="overlay" id="review" hidden></div>
<div class="overlay" id="event" hidden></div>

<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
