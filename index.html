<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0b">
<title>游戏工坊物语｜像素游戏工作室经营模拟</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f0d0b'/%3E%3Crect x='7' y='12' width='18' height='11' rx='2' fill='%23ffb454'/%3E%3Ccircle cx='12' cy='17' r='1.8' fill='%230f0d0b'/%3E%3Ccircle cx='20' cy='17' r='1.8' fill='%230f0d0b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header class="hud">
    <div class="hud-left">
      <div class="studio">游戏工坊物语</div>
      <div class="platform"><span id="date">1983 年 1 月 1 日</span> · 平台 <b id="platform">L-3</b></div>
    </div>

    <div class="hud-stats">
      <div class="hstat"><label>资金</label><b id="money">$0</b></div>
      <div class="hstat"><label>粉丝</label><b id="fans">0</b></div>
      <div class="hstat"><label>声望</label><b id="rep">0</b></div>
    </div>

    <div class="hud-actions">
      <button class="hud-btn" data-act="team">团队</button>
      <button class="hud-btn" data-act="research">研究</button>
      <button class="hud-btn" data-act="industry">行业</button>
      <button class="hud-btn" data-act="archive">作品集</button>
      <button class="icon" id="setbtn" data-act="settings" title="设置" aria-label="设置">⚙</button>
      <button class="icon" id="helpbtn" data-act="help" title="怎么玩" aria-label="怎么玩">?</button>
      
      
    </div>
  </header>

  <section class="office" aria-label="办公室">
    <canvas class="office-scene" id="office-scene" aria-hidden="true"></canvas>
    <div class="desks" id="desks"></div>
  </section>

  <main id="stage"></main>

  <footer class="hint" id="hint"></footer>

</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="overlay" id="review" hidden></div>
<div class="overlay" id="event" hidden></div>
<div class="overlay" id="team" hidden></div>
<div class="overlay" id="archive" hidden></div>
<div class="overlay" id="offline" hidden></div>
<div class="overlay" id="industry" hidden></div>
<div class="overlay" id="research" hidden></div>
<div class="overlay" id="help" hidden></div>
<div class="overlay" id="settings" hidden></div>

<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/office.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
