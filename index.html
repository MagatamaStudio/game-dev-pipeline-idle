<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="从 1972 年的车库到服务型时代——一款关于做游戏的增量放置游戏。">
<title>游戏开发流水线 · Game Dev Pipeline Idle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Crect x='6' y='11' width='20' height='12' rx='3' fill='%234fc3a1'/%3E%3Ccircle cx='12' cy='17' r='2.2' fill='%230b0d10'/%3E%3Ccircle cx='20' cy='17' r='2.2' fill='%230b0d10'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-era="0">

<div id="app">

  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="era-badge">
        <span id="era-year">1972</span>
        <span id="era-cycle" class="cycle">第 1 轮</span>
      </div>
      <div class="brand-text">
        <h1 id="era-name">街机黎明</h1>
        <p id="era-tagline">一枚硬币，两块挡板，一个行业。</p>
      </div>
    </div>

    <div class="wallet">
      <div class="money" id="money">$0</div>
      <div class="income"><span id="income">$0</span> / 秒</div>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-k">声望</span><span class="stat-v" id="fame">0</span></div>
      <div class="stat"><span class="stat-k">传承</span><span class="stat-v accent" id="legacy">0</span></div>
    </div>

    <div class="top-actions">
      <button id="btn-burst" class="burst" title="短时间大幅提升所有部门产能">
        <span class="burst-label">灵感迸发</span>
        <span class="burst-sub" id="burst-sub">就绪</span>
        <span class="burst-fill" id="burst-fill"></span>
      </button>
      <button id="btn-menu" class="icon-btn" aria-label="菜单">☰</button>
    </div>
  </header>

  <!-- ============ 主体 ============ -->
  <main>
    <section id="pipeline" aria-label="开发流水线">
      <div class="pipeline-head">
        <h2>流水线</h2>
        <p class="hint">项目按顺序流过每个部门。整条线的速度取决于最慢的那个部门。</p>
      </div>
      <div id="pipeline-cols" class="pipeline-cols"></div>
      <div id="pipeline-empty" class="pipeline-empty" hidden>
        <p>还没有在制项目。</p>
      </div>
    </section>

    <aside id="shop" aria-label="工作室">
      <div class="shop-tabs" role="tablist">
        <button class="tab active" data-tab="team" role="tab">团队</button>
        <button class="tab" data-tab="tech" role="tab">技术</button>
        <button class="tab" data-tab="legacy" role="tab">传承</button>
      </div>
      <div id="shop-body" class="shop-body"></div>
    </aside>
  </main>

  <!-- ============ 底部目标 ============ -->
  <footer class="goalbar">
    <div class="goal-text">
      <span class="goal-label">本时代目标</span>
      <span id="goal-desc">发行 10 部作品</span>
    </div>
    <div class="goal-track"><i id="goal-fill"></i></div>
    <div class="goal-count" id="goal-count">0 / 10</div>
    <button id="btn-advance" class="advance" disabled>进入下一个时代</button>
  </footer>

</div>

<!-- 吐司 -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- 弹窗 -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-eyebrow" id="modal-eyebrow"></div>
    <h3 id="modal-title"></h3>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
